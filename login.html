<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription | GOANGEL</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07090f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <canvas id="bg" aria-hidden="true"></canvas>
  <main class="auth-box">
    <p class="logo" id="brand"></p>
    <h1>Accédez au moteur</h1>
    <div class="tabs" role="tablist">
      <button id="tab-register" role="tab" type="button">Inscription</button>
      <button id="tab-login" role="tab" type="button">Connexion</button>
    </div>
    <form id="form" novalidate>
      <label class="only-register">Nom
        <input id="name" autocomplete="name" required>
      </label>
      <label>E-mail
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>Mot de passe
        <input id="password" type="password" minlength="8" required>
      </label>
      <label class="only-register">Confirmer le mot de passe
        <input id="password2" type="password" autocomplete="new-password">
      </label>
      <label class="check only-register">
        <input id="accept" type="checkbox">
        <span>J'ai au moins <span id="minage"></span> ans et j'accepte que GOANGEL est un outil d'analyse sans garantie de gains.</span>
      </label>
      <p id="msg" class="error" role="alert"></p>
      <button id="submit" class="btn" type="submit">Créer mon compte</button>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script src="js/background.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
