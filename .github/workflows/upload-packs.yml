name: Upload Packs to Backblaze B2

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install boto3
        run: pip install boto3

      - name: Upload avec Python Boto3
        env:
          B2_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_REGION_NAME: ${{ secrets.B2_REGION }}
        run: |
          python -c "
          import os, boto3
          from botocore.config import Config
          
          s3 = boto3.client(
              's3',
              endpoint_url=os.environ['B2_ENDPOINT_URL'],
              region_name=os.environ['B2_REGION_NAME'],
              aws_access_key_id=os.environ['B2_KEY_ID'],
              aws_secret_access_key=os.environ['B2_APP_KEY'],
              config=Config(signature_version='s3v4')
          )
          
          bucket = os.environ['B2_BUCKET_NAME']
          for root, dirs, files in os.walk('packs'):
              for file in files:
                  if file == '.gitkeep': continue
                  file_path = os.path.join(root, file)
                  s3_key = file_path
                  print(f'Upload de {file_path} vers {s3_key}...')
                  s3.upload_file(file_path, bucket, s3_key)
          print('✅ Upload terminé avec succès !')
          "
