name: GOANGEL AI Backend

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: goangel-ai-backend
  cancel-in-progress: false

jobs:
  run-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 359

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama & Pull Model
        run: |
          ollama serve > ollama.log 2>&1 &
          sleep 15
          ollama pull phi3:mini
          curl -s http://localhost:11434/api/generate -d '{"model": "phi3:mini", "keep_alive": -1}' > /dev/null 2>&1 &

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Start FastAPI Backend
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          CRYPTO_API_KEY: ${{ secrets.CRYPTO_API_KEY }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          nohup python backend.py > backend.log 2>&1 &
          echo $! > backend.pid
          sleep 5

      - name: Start Cloudflare Tunnel
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel run --token ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }} > tunnel.log 2>&1 &
          sleep 10

      - name: Exécution jusqu'à l'échéance
        run: |
          DEADLINE=$(( $(date +%s) + 21480 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if ! kill -0 "$(cat backend.pid)" 2>/dev/null; then
              echo "❌ Le backend s'est arrêté"; exit 1
            fi
            sleep 30
          done

      - name: Arrêt propre
        if: always()
        run: |
          kill -TERM "$(cat backend.pid)" 2>/dev/null || true
          pkill -f cloudflared || true
          pkill -f "ollama serve" || true

      - name: Relance automatique
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ai-backend.yml --ref main --repo "${{ github.repository }}"
